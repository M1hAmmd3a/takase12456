<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاجئني PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#05050a;--card:#0f0f1a;--text:#fff;--p:#00f5d4;--s:#9b5de5}
  body.light{--bg:#f0f0ff;--card:#fff;--text:#111;--p:#0066ff;--s:#ff006e}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
  body{background:var(--bg);color:var(--text);transition:.3s}
  .particles{position:fixed;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 30% 40%,var(--s) 0%,transparent 50%),radial-gradient(circle at 70% 60%,var(--p) 0%,transparent 50%);filter:blur(120px);animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  nav{display:flex;justify-content:space-between;padding:20px 5%;backdrop-filter:blur(10px);position:sticky;top:0;background:rgba(0,0,0,.2)}
  .btn{background:linear-gradient(90deg,var(--p),var(--s));border:none;padding:12px 30px;border-radius:50px;color:#fff;font-weight:900;cursor:pointer;transition:.3s}
  .btn:hover{transform:scale(1.05);box-shadow:0 0 30px var(--p)}
  .hero{text-align:center;padding:120px 20px}
  .hero h1{font-size:4rem;background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 2s ease-in-out infinite}
  @keyframes glow{50%{filter:drop-shadow(0 0 20px var(--p))}}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;padding:60px 5%}
  .card{background:var(--card);padding:40px;border-radius:25px;border:1px solid rgba(255,255,255,.1);transition:.4s}
  .card:hover{transform:perspective(1000px) rotateX(10deg) translateY(-15px);border-color:var(--p)}
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);justify-content:center;align-items:center}
  .modal-content{background:var(--card);padding:40px;border-radius:20px;width:90%;max-width:600px}
  input,textarea{width:100%;padding:15px;margin:10px 0;background:var(--bg);border:2px solid var(--p);border-radius:10px;color:var(--text);font-size:1rem}
  #chatBox{height:300px;overflow-y:auto;border:2px solid var(--p);border-radius:15px;padding:15px;margin:20px 0}
  .msg{padding:10px 15px;border-radius:15px;margin:10px 0;max-width:80%}
  .user{background:var(--p);margin-left:auto}
  .ai{background:var(--s)}
</style>
</head>
<body>
<div class="particles"></div>

<nav>
  <h2>فاجئني PRO</h2>
  <div>
    <button class="btn" onclick="toggleTheme()">🌓</button>
    <button class="btn" onclick="openModal('login')">دخول</button>
  </div>
</nav>

<section class="hero">
  <h1>موقع بقدرات خارقة</h1>
  <p>شات AI + مولد أفكار + لوحة تحكم + كل شيء</p>
  <button class="btn" onclick="surprise()">فاجئني بفكرة مشروع 🔥</button>
  <h3 id="idea" style="margin-top:30px;min-height:60px"></h3>
</section>

<section class="grid">
  <div class="card"><h3>🤖 شات AI</h3><p>اسألني أي شيء في البرمجة</p><button class="btn" onclick="openModal('chat')">افتح الشات</button></div>
  <div class="card"><h3>🎨 مولد صور</h3><p>اوصف الصورة وأنا أولدها</p><button class="btn" onclick="openModal('image')">ولد صورة</button></div>
  <div class="card"><h3>📊 لوحة التحكم</h3><p>إحصائيات ومستخدمين</p><button class="btn" onclick="openModal('dashboard')">ادخل</button></div>
</section>

<div id="chat" class="modal"><div class="modal-content">
  <h2>شات مع Meta AI</h2><div id="chatBox"></div>
  <input id="chatInput" placeholder="اكتب سؤالك...">
  <button class="btn" onclick="sendMsg()">إرسال</button>
  <button class="btn" onclick="closeModal('chat')">إغلاق</button>
</div></div>

<div id="image" class="modal"><div class="modal-content">
  <h2>مولد الصور</h2><input id="imgPrompt" placeholder="مثال: موقع فخم باللون الأزرق">
  <button class="btn" onclick="genImage()">ولد</button>
  <div id="imgResult"></div>
  <button class="btn" onclick="closeModal('image')">إغلاق</button>
</div></div>

<div id="dashboard" class="modal"><div class="modal-content">
  <h2>لوحة التحكم</h2><p>المستخدمين: 1,243</p><p>المشاريع: 5,892</p><p>الأفكار المولدة: 98,231</p>
  <button class="btn" onclick="closeModal('dashboard')">إغلاق</button>
</div></div>

<div id="login" class="modal"><div class="modal-content">
  <h2>تسجيل دخول</h2><input placeholder="الإيميل"><input type="password" placeholder="كلمة السر">
  <button class="btn">دخول</button><button class="btn" onclick="closeModal('login')">إغلاق</button>
</div></div>

<script>
const ideas=["نظام واتساب متعدد اللغات","متجر الكتروني بـ AI","تطبيق توصيل","SaaS لإدارة الشركات","لعبة 3D في المتصفح","منصة تعليمية","بوت تداول","نظام مستشفى"];
function surprise(){document.getElementById('idea').innerText=ideas[Math.floor(Math.random()*ideas.length)]}
function toggleTheme(){document.body.classList.toggle('light')}
function openModal(id){document.getElementById(id).style.display='flex'}
function closeModal(id){document.getElementById(id).style.display='none'}
function sendMsg(){
  let i=document.getElementById('chatInput'),box=document.getElementById('chatBox');
  if(!i.value)return;
  box.innerHTML+=`<div class="msg user">${i.value}</div>`;
  setTimeout(()=>{box.innerHTML+=`<div class="msg ai">هذا رد AI على: ${i.value}. أقدر أبني لك كود كامل له</div>`;box.scrollTop=box.scrollHeight},500);
  i.value='';
}
function genImage(){
  let p=document.getElementById('imgPrompt').value;
  document.getElementById('imgResult').innerHTML=`<p>تم توليد صورة لـ: ${p}</p><p>ملاحظة: في النسخة الحقيقية هنا بربطها بـ API صور</p>`;
}
</script>
</body>
</html>
